<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#18212f">
    <title>STUN-NAT Console</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/app.css">
  </head>
  <body class="console">
    <header class="topbar">
      <div class="brand"><strong>STUN-NAT</strong><span class="version" id="version"></span><span class="tagline">动态端口穿透</span></div>
      <div class="topbar-actions">
        <div id="summary">加载中</div>
        <span class="account-name" id="user" hidden></span>
        <button type="button" class="ghost" id="logout">退出登录</button>
      </div>
    </header>
    <main>
      <section class="toolbar"><div><h1>穿透规则</h1><p>公网端口由 NAT 运行状态决定，不能指定或固定。</p></div><div class="toolbar-actions"><button type="button" class="secondary" id="exportRules">导出</button><button type="button" class="secondary" id="importRules">导入</button><button id="newRule">添加规则</button><input type="file" id="importFile" accept="application/json,.json" hidden></div></section>
      <section id="empty" class="empty" hidden><h2>尚未创建穿透规则</h2><p>创建后，系统会在本机绑定通道端口，持续获取公网映射并按配置转发流量。</p></section>
      <section id="rules" class="rules"></section>
    </main>
    <dialog id="editor">
      <form id="ruleForm" method="dialog">
        <header><h2 id="dialogTitle">添加穿透规则</h2><button type="button" class="icon" id="closeEditor" title="关闭">×</button></header>
        <input type="hidden" name="id">
        <div class="form-grid">
          <fieldset class="form-section wide">
            <legend>基础</legend>
            <div class="section-grid">
              <label>规则名称<input name="name" required maxlength="80" placeholder="例如：家庭 Web 服务"></label>
              <label id="templateField">规则模板<select id="ruleTemplate"><option value="">不使用模板</option><option value="web">Web 服务（TCP 443）</option><option value="nas">NAS 管理（TCP 5000）</option><option value="ssh">SSH（TCP 22）</option><option value="game">游戏联机（UDP 25565）</option></select><small>仅用于新规则，选择后自动填入推荐参数。</small></label>
              <label>操作模式<select id="viewMode"><option value="simple">简易模式</option><option value="advanced">定制模式</option></select><small>简易模式采用推荐参数；定制模式显示全部选项。</small></label>
              <label>穿透类型<select name="protocol"><option value="tcp">IPv4 TCP</option><option value="udp">IPv4 UDP</option></select></label>
              <label>通道监听端口<input name="bindPort" type="number" min="0" max="65535" value="0"><small>填 0 时自动选择随机端口；局域网内应避免冲突。</small></label>
              <label>转发模式<select name="mode" id="mode"><option value="forward">本机代理转发（forward）</option><option value="bind">路由器直转（bind）</option></select></label>
              <label class="target">目标地址<input name="targetHost" placeholder="192.168.1.20 或 nas.lan"></label>
              <label class="target">目标端口<input name="targetPort" type="number" min="1" max="65535" placeholder="443"></label>
            </div>
          </fieldset>
          <fieldset class="form-section wide advanced">
            <legend>STUN 与保活</legend>
            <div class="section-grid">
              <label>STUN 服务器<input name="stunServer" required value="turn.cloudflare.com:3478"></label>
              <label class="tcp-only">TCP 保活服务器<input name="keepaliveServer" value="www.cloudflare.com:80"><small>TCP 规则须保持此连接，以维持 NAT 映射。</small></label>
              <label>保活间隔（秒）<input name="interval" type="number" min="5" max="3600" value="10"></label>
              <label>UDP STUN 检测周期<input name="checkEvery" type="number" min="1" max="3600" value="1"><small>每 N 次保活后重新探测映射。</small></label>
            </div>
          </fieldset>
          <fieldset class="form-section wide advanced">
            <legend>上级路由与防火墙</legend>
            <div class="section-grid">
              <label>上级路由映射<select name="routerMapping"><option value="upnp" selected>UPnP IGD（默认）</option><option value="none">不使用</option><option value="nat-pmp">NAT-PMP</option></select><small>默认使用 UPnP，路由器须启用 UPnP IGD；运行在主路由上可选择“不使用”。</small></label>
              <label class="wide">防火墙备注<input name="firewallNote" placeholder="例如：已放行 WAN TCP 端口；或记录路由器 DNAT 规则"></label>
              <label class="checkbox wide"><input name="firewallAuto" type="checkbox"> Linux 主路由上自动放行本规则的防火墙端口</label>
            </div>
          </fieldset>
          <fieldset class="form-section wide advanced">
            <legend>公网探针</legend>
            <div class="section-grid">
              <label class="wide">公网探针地址<input name="externalProbeUrl" placeholder="https://probe.example.com/probe"><small>部署在公网 VPS 的 STUNMap Probe。留空时仅使用本地 STUN/保活心跳。</small></label>
              <label>公网探针令牌<input name="externalProbeToken" type="password" autocomplete="new-password"></label>
              <label>公网探针间隔（秒）<input name="probeInterval" type="number" min="5" max="3600" value="10"></label>
            </div>
          </fieldset>
          <fieldset class="form-section wide advanced">
            <legend>映射 Webhook</legend>
            <div class="section-grid">
              <label class="wide">映射 Webhook 地址<span class="input-row"><input name="webhookUrl" placeholder="https://example.com/hooks/stunmap"><button type="button" class="secondary webhook-test" id="testWebhook">测试</button></span><small>首次映射成功或 IP/端口变化后调用。心跳不会重复触发；测试使用示例映射数据。</small></label>
              <p class="webhook-result wide" id="webhookResult" role="status" hidden></p>
              <label>Webhook 方法<select name="webhookMethod"><option value="post">POST JSON</option><option value="get">GET 查询参数</option></select></label>
              <label class="wide webhook-body">Webhook POST JSON 模板<textarea name="webhookBody" spellcheck="false" placeholder='{"public_ip":"{{STUN_PUBLIC_IP}}","public_port":{{STUN_PUBLIC_PORT}},"public_addr":"{{STUN_PUBLIC_ADDR}}"}'></textarea><small>可用变量：STUN_PUBLIC_IP、STUN_PUBLIC_PORT、STUN_PUBLIC_ADDR、STUN_PRIVATE_IP、STUN_PRIVATE_PORT、STUN_PRIVATE_ADDR、STUN_IP4P、STUN_PROTOCOL、STUN_RULE_ID、STUN_RULE_NAME、STUN_ROUTER_IP、STUN_ROUTER_PORT。支持双花括号、美元花括号或单花括号写法。</small></label>
            </div>
          </fieldset>
          <label class="checkbox wide"><input name="enabled" type="checkbox" checked> 保存后立即启用</label>
        </div>
        <footer><button type="button" class="secondary" id="cancelEditor">取消</button><button type="submit">保存规则</button></footer>
      </form>
    </dialog>
    <dialog id="confirmDialog" class="confirm">
      <div class="confirm-body">
        <h2>确认操作</h2>
        <p id="confirmMessage"></p>
      </div>
      <footer><button type="button" class="secondary" id="confirmCancel">取消</button><button type="button" class="danger" id="confirmOk">确认</button></footer>
    </dialog>
    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
    <template id="cardTemplate">
      <article class="rule">
        <header><div><h2 class="name"></h2><p class="meta"></p></div><div class="actions"><button class="toggle"></button><button class="secondary edit">编辑</button><button class="secondary copy">复制</button><button class="danger delete">删除</button></div></header>
        <div class="mapping"></div>
        <div class="details"></div>
        <details class="log-details"><summary>规则日志</summary><div class="log-toolbar"><div class="log-tools"><small>东八区（UTC+8）</small><select class="log-filter" aria-label="日志级别筛选"><option value="all">全部级别</option><option value="info">信息</option><option value="warn">警告</option><option value="error">错误</option></select><input class="log-search" type="search" placeholder="搜索日志" aria-label="搜索日志"></div><div class="log-tools"><button type="button" class="secondary log-download">下载日志</button><button type="button" class="secondary log-latest" disabled>已显示最新日志</button></div></div><pre class="logs" tabindex="0" aria-label="规则日志（东八区）"></pre></details>
        <details class="history-details"><summary>映射历史</summary><ol class="history" aria-label="最近映射历史"></ol></details>
      </article>
    </template>
    <script type="module" src="/app.js"></script>
  </body>
</html>
